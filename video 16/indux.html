<!DOCTYPE html>
<html>

<head>
    <title>Video and Audio Player</title>
</head>

<body>

    <h1>My Video and Audio Program</h1>

    <h2>🎥 Videos</h2>

    <video width="200" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

    <video width="200" controls>
        <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
    </video>

    <video width="200" controls>
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    </video>

    <video width="200" controls>
        <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
    </video>

    <video width="200" controls>
        <source src="https://media.w3.org/2010/05/bunny/trailer.mp4" type="video/mp4">
    </video>

    <hr>

    <h2> Audios</h2>

    <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mp3">
    </audio>

    <audio controls>
        <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
    </audio>

    <audio controls>
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3" type="audio/mp3">
    </audio>

    <audio controls>
        <source src="https://media.w3.org/2010/07/bunny/04-Death_Becomes_Fur.mp3" type="audio/mp3">
    </audio>

    <audio controls>
        <source src="https://media.w3.org/2010/07/bunny/01-Opening_Sequence.mp3" type="audio/mp3">
    </audio>

</body>

</html>
