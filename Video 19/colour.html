<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colours</title>
    <style>
        h1 {

            color: blue;
            color: hexadecimal value #0000FF;
            color: rgb(0, 0, 255);
            color: rgba(0, 0, 255, 1);
            color: hsl(240, 100%, 50%);

        }
    </style>

</head>

<body>
    <h1>This was about for colours</h1>
    <p>This paragraph has a different color:
    <ol>
        <li>colour keywords</li>
        <li>hexadecimal values</li>
        <li>rgb values</li>
        <li>rgba</li>
        <li>hsl</li>
    </ol>
    </p>


</body>

</html>
