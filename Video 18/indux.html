<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        * {
            margin: 10px;
            padding: 10px;
            border: 5px solid black;
        }

        .box {
            background-color: green;

        }

        .box1 {
            color: rgb(77, 194, 104);
            padding: 10px;
            margin: 5px;
            border: 4px solid rgb(213, 65, 65);
            height: 150px;
            width: 150px;
        }

        .box2 {
            color: red;
            color: rgb(77, 194, 104);
            padding: 10px;
            margin: 5px;
            border: 4px solid rgb(213, 65, 65);
            height: 150px;
            width: 150px;

        }
    </style>


</head>

<body>
    <div class="box box1"> I am a box </div>
    <div class="box box2"> I am another box </div>

</body>

</html>
